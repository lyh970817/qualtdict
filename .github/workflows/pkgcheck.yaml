name: pkgcheck

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  pkgcheck:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      # Read, not write: this workflow deliberately posts nothing to the
      # issue tracker (see the pkgcheck-action step below). The action still
      # runs a search for a target issue whatever the inputs say, which needs
      # read; withholding write means that if the no-posting configuration is
      # ever lost, the run fails loudly instead of quietly reopening the bot
      # issue habit.
      issues: read
    steps:
      # The pkgcheck container runs as root, while the checkout it mounts at
      # /github/workspace is owned by the runner user, so libgit2 refuses to
      # open the repository ("is not owned by current user"). A container
      # action sees $HOME as /github/home, mounted from runner.temp, so
      # writing safe.directory there reaches the container's git config.
      - name: Let the pkgcheck container open the checkout
        run: |
          mkdir -p "${{ runner.temp }}/_github_home"
          printf '[safe]\n\tdirectory = *\n' \
            >> "${{ runner.temp }}/_github_home/.gitconfig"

      # pkgcheck's "Package fails continuous integration checks" item reads
      # the OTHER workflow runs for this commit at whatever moment pkgcheck
      # itself finishes -- it does not wait for them. On a push, R-CMD-check
      # can run far longer than pkgcheck (it stalls installing rJava/openNLP
      # on the Ubuntu devel leg), so pkgcheck used to finish -- and query --
      # while R-CMD-check was still in_progress, and get scored as failing
      # CI even when every pkgcheck item passed. Block here until the
      # sibling push-triggered workflows for this SHA have reached a
      # terminal state, so the CI-status item sees their real conclusions.
      # Skipped on workflow_dispatch (manual reruns), since those siblings
      # were not necessarily triggered by this invocation and would just
      # time out.
      - name: Wait for sibling workflows to finish
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="${{ github.repository }}"
          sha="${{ github.sha }}"
          # Workflow file names (not display names) of the other
          # push-triggered workflows whose conclusions pkgcheck's
          # CI-status item consults.
          siblings="check-standard.yaml pkgdown.yaml test-coverage.yaml"
          timeout_s=2700   # 45 min: R-CMD-check has taken up to ~26 min.
          interval_s=30
          elapsed=0
          while true; do
            pending=0
            for wf in $siblings; do
              status=$(gh api \
                "repos/$repo/actions/workflows/$wf/runs?head_sha=$sha&per_page=1" \
                -q '.workflow_runs[0].status // "not_started"')
              echo "$wf: $status"
              if [ "$status" != "completed" ]; then
                pending=1
              fi
            done
            if [ "$pending" -eq 0 ]; then
              echo "All sibling workflows have completed."
              break
            fi
            if [ "$elapsed" -ge "$timeout_s" ]; then
              echo "::error::Timed out after ${timeout_s}s waiting for sibling workflows (check-standard, pkgdown, test-coverage) to finish for $sha."
              exit 1
            fi
            sleep "$interval_s"
            elapsed=$((elapsed + interval_s))
          done

      # Both inputs are set against the action's defaults, and both must stay
      # set -- restoring the defaults brings the bot issues back.
      #
      # post-to-issue defaults to true, which made every push to main add a
      # comment to a bot-authored issue titled "pkgcheck results - main"
      # (25 comments accumulated on #18). Worse, the action locates that
      # issue with an `is:open` search and falls back to "no issue found",
      # which it treats as "create one": once #18 was closed, the next push
      # would have opened a fresh issue, and every push after a close would
      # do it again. The tracker is a review surface for the rOpenSci
      # resubmission, so pkgcheck results go to the run instead -- see the
      # two steps below.
      #
      # summary-only defaults to true and only ever chose WHICH file the
      # issue comment carried: the container writes both summary.md and the
      # complete full.md on every run regardless. It is false here so the
      # intent is on the record, but with post-to-issue false it is inert.
      - uses: ropensci-review-tools/pkgcheck-action@main
        with:
          post-to-issue: false
          summary-only: false

      # The action exposes no outputs and writes nothing to the job summary,
      # so the full report is surfaced here. The container leaves its
      # markdown in the checkout, both at the workspace root and copied into
      # .pkgcheck/. always() because the action's last step exits non-zero
      # when pkgcheck finds problems -- exactly when the report matters most.
      - name: Publish the full pkgcheck report to the job summary
        if: always()
        run: |
          set -euo pipefail
          report=.pkgcheck/full.md
          [ -f "$report" ] || report=full.md
          if [ ! -f "$report" ]; then
            echo "::warning::pkgcheck wrote no full.md; see the run log."
            echo "pkgcheck produced no report file." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # A job summary is capped at 1 MiB per step; the artifact uploaded
          # by the next step always carries the untruncated file.
          limit=900000
          if [ "$(wc -c < "$report")" -gt "$limit" ]; then
            head -c "$limit" "$report" >> "$GITHUB_STEP_SUMMARY"
            printf '\n\n_Truncated at %s bytes; the full report is in the\n' \
              "$limit" >> "$GITHUB_STEP_SUMMARY"
            printf 'pkgcheck-report artifact._\n' >> "$GITHUB_STEP_SUMMARY"
          else
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
            printf '\n' >> "$GITHUB_STEP_SUMMARY"
          fi

      # include-hidden-files because .pkgcheck/ is a dotted directory, which
      # upload-artifact v4 skips by default.
      - name: Upload the pkgcheck report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pkgcheck-report
          include-hidden-files: true
          if-no-files-found: warn
          path: |
            .pkgcheck/full.md
            .pkgcheck/summary.md
            full.md
            summary.md
